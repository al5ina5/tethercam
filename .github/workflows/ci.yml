name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/tethercam scripts/tethercam-daemon \
            install.sh uninstall.sh packaging/deb/build-deb.sh \
            packaging/install-online.sh tests/test-routing.sh
      - name: Build .deb
        run: packaging/deb/build-deb.sh
      - name: Inspect .deb
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb
      - name: Tests
        run: bash tests/test-routing.sh
