name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: |
          v="$(tr -d ' \n' < VERSION)"
          [ "v$v" = "${GITHUB_REF_NAME}" ] \
            || { echo "tag ${GITHUB_REF_NAME} != VERSION $v"; exit 1; }
      - name: Build .deb
        run: packaging/deb/build-deb.sh
      - name: Checksums
        run: |
          cd dist
          sha256sum ./*.deb > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.deb dist/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.deb dist/SHA256SUMS \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi
